# 接近生产的一层：Postgres + Redis。由 docker compose 注入主机名。
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/prodclinic
    username: clinic
    password: clinic
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: redis
      port: 6379

clinic:
  redis:
    enabled: true
