apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: prod-clinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: prod-clinic-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: prod-clinic
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
