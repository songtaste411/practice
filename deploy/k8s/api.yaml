apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: prod-clinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: prod-clinic-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: prod-clinic-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: prod-clinic
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
