apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: prod-clinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: clinic
            - name: POSTGRES_PASSWORD
              value: clinic
            - name: POSTGRES_DB
              value: prodclinic
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "clinic", "-d", "prodclinic"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: prod-clinic
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
