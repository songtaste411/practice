apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: prod-clinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/redis:7.4
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: prod-clinic
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
